server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # App de una sola página: cualquier ruta cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash de Vite: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
