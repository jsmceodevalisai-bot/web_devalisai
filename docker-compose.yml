services:
  # Producción: Nginx ligero con el build compilado
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devalisai-app
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production

  # Opcional - Modo Desarrollo con hot-reload (iniciar con: docker compose --profile dev up)
  dev:
    profiles: ["dev"]
    image: node:20-alpine
    container_name: devalisai-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
